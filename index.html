<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buenos días 🎀</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(to bottom, #ffc0e0, #fff0f7);
    font-family: "Comic Sans MS", Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
  }

  /* Sol que gira */
  .sol {
    position: fixed;
    top: 10px;
    right: 15px;
    font-size: 50px;
    animation: girar 10s linear infinite;
  }

  /* Nube que pasa */
  .nube {
    position: fixed;
    top: 90px;
    font-size: 55px;
    animation: pasar 25s linear infinite;
  }

  h1 {
    color: #e0187a;
    font-size: 42px;
    margin: 50px 10px 0 10px;
    animation: latido 2s infinite;
  }

  h2 {
    color: #ff5fa2;
    font-size: 22px;
    margin-top: 5px;
  }

  /* El gatito */
  .gato {
    display: inline-block;
    animation: saltar 1.5s infinite;
  }

  .mono {
    transform-origin: 178px 62px;
    animation: mover 2s infinite;
  }

  .brazo {
    transform-origin: 212px 235px;
    animation: saludar 1s infinite;
  }

  .ojo {
    transform-origin: center;
    transform-box: fill-box;
    animation: parpadear 4s infinite;
  }

  .caja {
    background: white;
    border: 4px dashed hotpink;
    border-radius: 25px;
    max-width: 380px;
    margin: 20px auto;
    padding: 20px;
    font-size: 22px;
    color: purple;
  }

  .examen {
    background: hotpink;
    color: white;
    font-size: 26px;
    font-weight: bold;
    max-width: 380px;
    margin: 20px auto;
    padding: 18px;
    border-radius: 25px;
    animation: latido 1.5s infinite;
  }

  .iconos span {
    display: inline-block;
    font-size: 35px;
    margin: 5px;
    animation: saltar 1.2s infinite;
  }

  button {
    background: #ff5fa2;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 14px 28px;
    font-size: 20px;
    font-family: inherit;
    cursor: pointer;
    margin: 20px 0 10px 0;
  }

  button:hover {
    background: #e0187a;
  }

  #sorpresa {
    color: #e0187a;
    font-size: 22px;
    margin-bottom: 40px;
  }

  /* Cosas que caen */
  .cae {
    position: fixed;
    top: -50px;
    animation: caer 7s linear forwards;
    pointer-events: none;
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  @keyframes pasar {
    from { left: -100px; }
    to { left: 100%; }
  }

  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  @keyframes saltar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  @keyframes mover {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }

  @keyframes saludar {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-25deg); }
  }

  @keyframes parpadear {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }

  @keyframes caer {
    to { transform: translateY(110vh) rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="sol">☀️</div>
  <div class="nube">☁️</div>

  <h1>¡Buenos días! 🌸</h1>
  <h2>¡Que tengas un lindo día!</h2>

  <!-- Gatita blanca con moño (dibujada con SVG) -->
  <div class="gato">
    <svg width="220" height="220" viewBox="0 0 300 300">
      <!-- cuerpo -->
      <path d="M110 210 q-8 70 40 72 q48 -2 40 -72z" fill="#ff8cc3" stroke="black" stroke-width="4"/>
      <!-- brazo que saluda -->
      <ellipse class="brazo" cx="212" cy="212" rx="13" ry="24" fill="white" stroke="black" stroke-width="4"/>
      <ellipse cx="102" cy="238" rx="13" ry="22" fill="white" stroke="black" stroke-width="4"/>
      <!-- orejas -->
      <path d="M62 92 L58 30 L112 62z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M238 92 L242 30 L188 62z" fill="white" stroke="black" stroke-width="4"/>
      <!-- cabeza -->
      <ellipse cx="150" cy="128" rx="100" ry="82" fill="white" stroke="black" stroke-width="4"/>
      <!-- ojos -->
      <ellipse class="ojo" cx="108" cy="130" rx="9" ry="12" fill="black"/>
      <ellipse class="ojo" cx="192" cy="130" rx="9" ry="12" fill="black"/>
      <!-- nariz -->
      <ellipse cx="150" cy="148" rx="10" ry="7" fill="gold" stroke="black" stroke-width="3"/>
      <!-- bigotes -->
      <g stroke="black" stroke-width="4" stroke-linecap="round">
        <line x1="46" y1="130" x2="78" y2="138"/>
        <line x1="42" y1="150" x2="76" y2="150"/>
        <line x1="46" y1="170" x2="78" y2="162"/>
        <line x1="254" y1="130" x2="222" y2="138"/>
        <line x1="258" y1="150" x2="224" y2="150"/>
        <line x1="254" y1="170" x2="222" y2="162"/>
      </g>
      <!-- moño -->
      <g class="mono">
        <path d="M178 62 L222 38 L222 86z" fill="#ff3d8b" stroke="black" stroke-width="4"/>
        <path d="M178 62 L134 38 L134 86z" fill="#ff3d8b" stroke="black" stroke-width="4"/>
        <circle cx="178" cy="62" r="12" fill="#ff8cc3" stroke="black" stroke-width="4"/>
      </g>
    </svg>
  </div>

  <div class="caja" id="frase">Tú puedes con todo 💪</div>

  <div class="examen">📚 ¡Mucha suerte en tu examen! ✏️</div>

  <div class="iconos">
    <span>🍀</span>
    <span style="animation-delay: 0.2s">⭐</span>
    <span style="animation-delay: 0.4s">🌷</span>
    <span style="animation-delay: 0.6s">🍓</span>
    <span style="animation-delay: 0.8s">🦋</span>
  </div>

  <button onclick="darSuerte()">Toca aquí 🍀</button>
  <p id="sorpresa">Hoy te va a ir increíble</p>

  <script>
    // Frases que van cambiando
    var frases = [
      "Tú puedes con todo 💪",
      "Confía en lo que estudiaste 📖",
      "Te va a ir muy bien 💖"
    ];

    var numero = 0;

    setInterval(function () {
      numero = numero + 1;
      document.getElementById("frase").textContent = frases[numero % frases.length];
    }, 3000);

    // Cosas que caen del cielo
    var dibujos = ["💖", "🌸", "⭐", "🎀", "🍓", "✨"];

    function crearCosa() {
      var cosa = document.createElement("div");
      cosa.className = "cae";
      cosa.textContent = dibujos[Math.floor(Math.random() * dibujos.length)];
      cosa.style.left = Math.random() * 95 + "vw";
      cosa.style.fontSize = (20 + Math.random() * 20) + "px";
      document.body.appendChild(cosa);
      setTimeout(function () { cosa.remove(); }, 7000);
    }

    setInterval(crearCosa, 500);

    // Botón de suerte
    var mensajes = [
      "¡Eres la mejor! 💖"
    ];

    var contador = 0;

    function darSuerte() {
      for (var i = 0; i < 25; i++) {
        crearCosa();
      }
      document.getElementById("sorpresa").textContent = mensajes[contador % mensajes.length];
      contador = contador + 1;
    }
  </script>

</body>
</html>
